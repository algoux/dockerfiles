name: Build nodebase 22

on:
  push:
    branches:
      - master
    paths:
      - nodebase/Dockerfile.22
      - .github/workflows/nodebase-22.yml
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The final Dockerfile RUN checks Node 22.23.4, the Brotli fix marker,
      # and a Brotli round-trip on both architectures. Do not publish on failure.
      - name: Build and verify both architectures before publishing
        uses: docker/build-push-action@v6
        with:
          context: ./nodebase
          file: ./nodebase/Dockerfile.22
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
          cache-from: type=gha,scope=nodebase-22
          cache-to: type=gha,mode=max,scope=nodebase-22

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push verified image
        uses: docker/build-push-action@v6
        with:
          context: ./nodebase
          file: ./nodebase/Dockerfile.22
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            algoux/nodebase:22
            algoux/nodebase:22.23.4
          cache-from: type=gha,scope=nodebase-22
          cache-to: type=gha,mode=max,scope=nodebase-22
